name: "Codacy Analysis Simplificado"

on:
  push:
    branches: [ main, feat_development, testing ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 6'  # Sábados a medianoche

jobs:
  codacy-analysis:
    name: Codacy Analysis
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-bullseye
        env:
          POSTGRES_USER: uchooseuser
          POSTGRES_PASSWORD: uchoosepass123
          POSTGRES_DB: uchoosedb
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Fix PYTHONPATH
        run: echo "PYTHONPATH=$(pwd)" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Run Django tests with coverage
        env:
          DJANGO_SETTINGS_MODULE: uchoose.settings  # Ajusta si tu settings.py está en otro lugar
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          PYTHONPATH: ${{ env.PYTHONPATH }}
        run: |
          cd Backend
          coverage run --branch --source=. ./manage.py test --keepdb
          coverage xml
          
      # Ejecutar el análisis de Codacy con salida directa a archivo
      - name: Run Codacy Analysis
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          mkdir -p codacy-results
          docker run --rm \
            -v $(pwd):/code \
            analyze --directory /code --format json > codacy-results/codacy-result.json
          head -n 10 codacy-results/codacy-result.json

      - name: Guardar resultados como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: codacy-analysis-results
          path: codacy-results
          retention-days: 30