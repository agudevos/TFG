name: "Codacy Analysis Simplificado"

on:
  push:
    branches: [ main, feat_development, testing ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 6'  # Sábados a medianoche

jobs:
  codacy-analysis:
    name: Codacy Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Run Django tests with coverage
        env:
          DJANGO_SETTINGS_MODULE: Backend.uchoose.settings  # Ajusta si tu settings.py está en otro lugar
        run: |
          coverage run --branch --source=. ./Backend/manage.py test --keepdb
          coverage xml

      - name: Codacy Coverage Reporter
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.xml

      # Ejecutar el análisis de Codacy con salida directa a archivo
      - name: Run Codacy Analysis
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          mkdir -p codacy-results
          docker run --rm \
            -v $(pwd):/code \
            analyze --directory /code --format json > codacy-results/codacy-result.json
          head -n 10 codacy-results/codacy-result.json

      - name: Guardar resultados como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: codacy-analysis-results
          path: codacy-results
          retention-days: 30